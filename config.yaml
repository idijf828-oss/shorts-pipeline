# ============================================
#  SHORTS PIPELINE — barcha sozlamalar shu faylda
#  (Niche, til, ovoz, jadval — faqat shu yerdan o'zgaradi)
# ============================================

channel:
  niche: "Geography & geopolitics explained on satellite maps"   # v10 map-explainer
  topics:                                     # TREND so'rovlari uchun
    - geopolitics
    - why questions geography
    - world map facts
    - strange borders
    - surprising places
  language: "en-US"                           # video tili
  voice: "en-US-ChristopherNeural"            # chuqur, professional (documentary) ovoz
  # Ovoz variantlari: en-US-ChristopherNeural (erkak, hujjatli),
  #                   en-US-GuyNeural (erkak, jonli), en-US-AriaNeural (ayol),
  #                   en-US-JennyNeural (ayol, iliq)
  voice_rate: "+8%"                            # v10 explainer: tez, aniq diktor (~150-170 so'z/min)

video:
  width: 1080
  height: 1920
  fps: 30
  # v10 map-explainer (qo'llanma): 15-35s, bitta savol + 2-3 sabab, 45-70 so'z
  min_duration: 18                            # sekund
  max_duration: 34                            # sekund (qattiy cheklov)
  tags: [geopolitics, maps, geography, world facts, borders,
         why, explained, shorts]

captions:
  enabled: true       # v10 map-explainer: so'zma-so'z markaz subtitr (qo'llanma: eng muhim element)
  y_map: 780              # ekran markazi atrofi (0.40H, past 20% safe-zone'dan yuqori)
  y_stock: 780            # insert kadrlarida ham markazda (subtitr uzluksiz)
  safe_w: 840            # maksimal matn kengligi (yon chetlar 8% safe zone)
  font_size: 100         # qalin oq + qora kontur (qo'llanma uslubi)
  max_words: 2           # qo'llanma: har kadrda 1-2 so'z

sources:
  youtube_region: "US"
  youtube_category: "27"                      # 27 = Education
  days_back: 30
  max_trend_items: 40
  trend_query_template: "{t}"                  # trend qidiruv shabloni
  # Xarita fallback'dan oldin emas — bu umumiy B-roll so'rovlari emas,
  # endi har sahna o'z visual_query ro'yxatini Gemini'dan oladi.
  generic_queries:
    - "world map aerial"
    - "aerial mountains"
    - "ocean drone shot"
    - "city skyline aerial"

sfx:
  enabled: true                    # SFX triggerlar
  mode: "explainer"                # v10: pop/whoosh/impact — ovozdan ~10dB past
  music_enabled: true              # v10: kuchsiz fon musiqa (qo'llanma: -15..-20dB past)
  music_volume: 0.04               # ~ -28dB (qo'llanma: ovozdan 15-20dB past)

audio:
  turbo: 1.05                      # gTTS zaxira tezligi (pitch buzilmasdan)
  pad_s: 0.32                      # v10: pauzalar qisqa (qo'llanma: "pauzani kesib tashla")
  silence_gap: 0.10                # gaplar orasi (doc C2)
  tail_pad: 0.5                    # video = ovoz + 0.5s (doc C3)

behavior:
  dry_run: false
  ending_mode: "cta"               # v13 (user 3-A): "cta" (savol bilan tugash)
                                   # yoki "loop" (oxiri hook'ga uzluksiz ulanadi;
                                   # seed'dagi ending_mode ustuvor)                  # true = render qiladi, YouTube'ga YUKLAMAYDI (test uchun)
  privacy_status: "private"       # API audit o'tgunicha faqat "private" ishlaydi
  telegram_approval_timeout_min: 120   # Tasdiq kutiladigan vaqt (Actions job 6 soatgacha yuradi)
  schedule_cron: "0 3,11,19 * * *"  # 3 run/kun (UTC). Tashkent: 08/16/24
                                  # DIQQAT: cron faqat .github/workflows/daily.yml'da o'zgaradi
                                  #        (GitHub cheklovi). Qolgan hamma narsa shu faylda.
gemini:
  model: "gemini-3.5-flash-lite"   # TIRIK model (2026-07 dan). Zaxiralar
                                   # avtomatik: 3.1-flash-lite, 3.8-flash,
                                   # 3.6-flash. ESLATMA: gemini-2.5-*/2.0-flash
                                   # 2026-10 da O'CHIRILGAN (404 beradi).
  temperature: 0.8                 # faktli kontent uchun pastroq aniqlik
