# ============================================
#  SHORTS PIPELINE — barcha sozlamalar shu faylda
#  (Niche, til, ovoz, jadval — faqat shu yerdan o'zgaradi)
# ============================================

channel:
  niche: "Mind-blowing geography and country facts"   # nich
  topics:                                     # mavzular (har kuni bittasi avtomatik tanlanadi)
    - borders
    - capitals
    - islands
    - mountains and volcanoes
    - deserts and oceans
    - unusual countries
    - maps and time zones
  language: "en-US"                           # video tili
  voice: "en-US-ChristopherNeural"            # chuqur, professional (documentary) ovoz
  # Ovoz variantlari: en-US-ChristopherNeural (erkak, hujjatli),
  #                   en-US-GuyNeural (erkak, jonli), en-US-AriaNeural (ayol),
  #                   en-US-JennyNeural (ayol, iliq)
  voice_rate: "+4%"                           # ovoz tezligi

video:
  width: 1080
  height: 1920
  fps: 30
  scenes: 7                                   # HOOK + 5 FAKT + LOOP (outro YO'Q)
  min_duration: 35                            # sekund (retention formati)
  max_duration: 40                            # sekund
  tags: [geography, facts, countries, world facts, maps, borders,
         did you know, education, shorts]

captions:
  enabled: true
  y: 1150                # dinamik subtitr pozitsiyasi (Shorts UI yopmaydi)
  safe_w: 860            # maksimal matn kengligi (x: 110..970 safe zone)
  font_size: 96          # dinamik so'z shrifti
  top_size: 64           # statik on_screen shrifti (tepa)

sources:
  youtube_region: "US"
  youtube_category: "27"                      # 27 = Education
  days_back: 30
  max_trend_items: 40
  trend_query_template: "{t} facts"           # trend qidiruv shabloni
  # Xarita fallback'dan oldin emas — bu umumiy B-roll so'rovlari emas,
  # endi har sahna o'z visual_query ro'yxatini Gemini'dan oladi.
  generic_queries:
    - "world map aerial"
    - "aerial mountains"
    - "ocean drone shot"
    - "city skyline aerial"

sfx:
  enabled: true                    # fon musiqasi + effektlar (false = sof ovoz)
  music_volume: 0.12               # fon musiqasi darajasi (0 = juda past)
  transitions: true                # riser(hook) + impact(3s) + whoosh(cutlar)

behavior:
  dry_run: false                  # true = render qiladi, YouTube'ga YUKLAMAYDI (test uchun)
  privacy_status: "private"       # API audit o'tgunicha faqat "private" ishlaydi
  telegram_approval_timeout_min: 120   # Tasdiq kutiladigan vaqt (Actions job 6 soatgacha yuradi)
  schedule_cron: "0 9 * * *"      # GitHub Actions UTC bo'yicha. Tashkent = +5 (14:00)
                                  # DIQQAT: cron faqat .github/workflows/daily.yml'da o'zgaradi
                                  #        (GitHub cheklovi). Qolgan hamma narsa shu faylda.
gemini:
  model: "gemini-3.5-flash-lite"   # TIRIK model (2026-07 dan). Zaxiralar
                                   # avtomatik: 3.1-flash-lite, 3.8-flash,
                                   # 3.6-flash. ESLATMA: gemini-2.5-*/2.0-flash
                                   # 2026-10 da O'CHIRILGAN (404 beradi).
  temperature: 0.8                 # faktli kontent uchun pastroq aniqlik
