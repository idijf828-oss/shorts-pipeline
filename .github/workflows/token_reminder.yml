name: YT Token Eslatma (22:20 Toshkent)

on:
  push:
    paths:
      - .github/workflows/token_reminder.yml
  schedule:
    - cron: "20 17 * * *"   # 17:20 UTC = 22:20 Toshkent, har kuni

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Token yoshini tekshirish (6 kun -> TG eslatma)
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          SHA=$(printf '%s' "$YT_REFRESH_TOKEN" | sha256sum | cut -d' ' -f1)
          NOW=$(date -u +%s); TODAY=$(date -u +%F)
          OLD=""; FIRST=0; LASTREM=""
          if [ -f token_state.json ]; then
            OLD=$(python3 -c "import json;print(json.load(open('token_state.json')).get('sha',''))" 2>/dev/null || true)
            FIRST=$(python3 -c "import json;print(int(json.load(open('token_state.json')).get('first_seen',0)))" 2>/dev/null || echo 0)
            LASTREM=$(python3 -c "import json;print(json.load(open('token_state.json')).get('last_reminded',''))" 2>/dev/null || true)
          fi
          if [ "$SHA" != "$OLD" ]; then
            if [ -z "$OLD" ] && [ "$FIRST" -gt 0 ]; then
              NEWFIRST=$FIRST
              echo "[token] SHA qayd etildi, first_seen saqlanadi (seed): $FIRST"
            else
              NEWFIRST=$NOW
              echo "[token] YANGI token sezildi, first_seen noldan: $NOW"
            fi
            printf '{\n "sha": "%s",\n "first_seen": %s,\n "last_reminded": "%s"\n}\n' "$SHA" "$NEWFIRST" "$LASTREM" > token_state.json
            git config user.name "shorts-bot"; git config user.email "bot@users.noreply.github.com"
            git add token_state.json
            git commit -m "token_state: SHA qayd etildi" || true
            git pull --rebase || true
            git push || true
            echo "[token] qayd etildi (eslatma yuborilmadi)"
            exit 0
          fi
          AGE=$(( (NOW - FIRST) / 86400 ))
          echo "[token] token yoshi: ${AGE} kun (first_seen: ${FIRST})"
          if [ "$AGE" -ge 6 ]; then
            MSG=$(sed "s/{{AGE}}/${AGE}/" scripts/token_message.txt)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" -o /tmp/tg_resp.json -w "TG HTTP %{http_code}\n" || true
            head -c 200 /tmp/tg_resp.json || true; echo
            echo "[token] ESLATMA YUBORILDI (${AGE} kun, ${TODAY}, 22:20 Toshkent rejimi)"
          else
            echo "[token] eslatma shart emas: yoshi ${AGE}/6 kun"
          fi
