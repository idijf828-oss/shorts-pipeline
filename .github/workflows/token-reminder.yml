# v13.6 (user, 2026-10-30): YT_REFRESH_TOKEN 7 kunda tugaydi (verifikatsiya-
# dan o'tmagan loyiha). Har kuni 17:20 UTC = 22:20 Toshkentda (token
# yangilangan AYNAN SHU vaqt) tekshiradi:
#   - token SHA o'zgargan  -> token_state.json yangilanadi (sana noldan)
#   - yoshi >= 6 kun      -> Telegram eslatma (yangilash qadamlari bilan)
# Tokenni faqat egasi yangilay oladi (Google login) — bu workflow faqat
# vaqtni kuzatadi va eslatadi. Butunlay yechim: GCP Console -> OAuth
# consent screen -> Publish app (In production) — 7 kunlik muddat yo'qoladi.
name: YT Token eslatma
on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"   # 17:20 UTC = 22:20 Toshkent, har kuni

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Token yoshini tekshirish
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          SHA=$(printf '%s' "$YT_REFRESH_TOKEN" | sha256sum | cut -d' ' -f1)
          NOW=$(date -u +%s)
          OLD_SHA=""; FIRST=0
          if [ -f token_state.json ]; then
            OLD_SHA=$(python3 -c "import json;print(json.load(open('token_state.json')).get('sha',''))" 2>/dev/null || echo "")
            FIRST=$(python3 -c "import json;print(int(json.load(open('token_state.json')).get('first_seen',0)))" 2>/dev/null || echo 0)
          fi
          if [ "$SHA" != "$OLD_SHA" ]; then
            echo "Token yangi (yoki birinchi ishga tushish) — sana yoziladi"
            python3 - "$SHA" "$NOW" <<'EOF'
import json, sys
json.dump({"sha": sys.argv[1], "first_seen": int(sys.argv[2])},
          open("token_state.json", "w"), indent=1)
EOF
            git config user.name "shorts-bot"
            git config user.email "bot@users.noreply.github.com"
            git add token_state.json
            git commit -m "token_state: YT_REFRESH_TOKEN qayd etildi" || true
            git pull --rebase || true
            git push
            exit 0
          fi
          AGE=$(( (NOW - FIRST) / 86400 ))
          echo "Token yoshi: $AGE kun (sha=${SHA:0:12}...)"
          if [ "$AGE" -ge 6 ]; then
            MSG="⏰ YT_REFRESH_TOKEN ${AGE} KUN BO'LDI — 7 kunda o'chadi!
Hozir yangilang (~2 daqiqa):
1️⃣ developers.google.com/oauthplayground → ⚙ → Use your own OAuth credentials (Client ID + Secret)
2️⃣ Scopes: youtube.upload + youtube.force-ssl → Authorize
3️⃣ KANAL EGASI hisobiga kiring → Advanced → Go to (unsafe) → Allow
4️⃣ Exchange authorization code for tokens → refresh_token nusxalang
5️⃣ github.com/idijf828-oss/shorts-pipeline → Settings → Secrets → Actions → YT_REFRESH_TOKEN → Update

Ertaga 22:20 da yana tekshiramiz — yangilagan bo'lsangiz eslatma to'xtaydi.
💡 BUTUNLAY hal qilish: GCP Console → APIs & Services → OAuth consent screen → Publish app — keyin 7 kunlik muddat umuman yo'qoladi."
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" > /dev/null
            echo "Eslatma yuborildi (${AGE} kun)"
          else
            echo "Hali eslatma kerak emas (${AGE}/6 kun)"
          fi
