name: Daily Shorts Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,11,19 * * *"   # Tashkent: 08/16/24 (user jadvali: 3 run/kun)

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: YT token jonliligi va eslatmasi (v13.9)
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          # ===== v13.9 JONLILIK TESTI: o'lik token -> run to'xtaydi, seed saqlanadi =====
          RESP=$(curl -s -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${YT_CLIENT_ID}" \
            --data-urlencode "client_secret=${YT_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${YT_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" \
            -w "\nHTTP_CODE:%{http_code}")
          HTTP_CODE=$(printf '%s' "$RESP" | sed -n 's/^HTTP_CODE://p' | tail -1)
          BODY=$(printf '%s' "$RESP" | grep -v '^HTTP_CODE:' | head -c 300)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[token] JONLILIK: OK — access token olindi"
          elif printf '%s' "$BODY" | grep -q "invalid_grant\|invalid_client"; then
            echo "[token] JONLILIK: O'LIK (HTTP ${HTTP_CODE}) — ${BODY}"
            MSG_DEAD=$(cat scripts/token_dead.txt)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG_DEAD}" -o /dev/null -w "TG HTTP %{http_code}\n" || true
            exit 1
          else
            echo "[token] JONLILIK: noma'lum (HTTP ${HTTP_CODE}) — pipeline o'zi sinaydi"
          fi
          SHA=$(printf '%s' "$YT_REFRESH_TOKEN" | sha256sum | cut -d' ' -f1)
          NOW=$(date -u +%s); TODAY=$(date -u +%F)
          OLD=""; FIRST=0; LASTREM=""
          if [ -f token_state.json ]; then
            OLD=$(python3 -c "import json;print(json.load(open('token_state.json')).get('sha',''))" 2>/dev/null || true)
            FIRST=$(python3 -c "import json;print(int(json.load(open('token_state.json')).get('first_seen',0)))" 2>/dev/null || echo 0)
            LASTREM=$(python3 -c "import json;print(json.load(open('token_state.json')).get('last_reminded',''))" 2>/dev/null || true)
          fi
          if [ "$SHA" != "$OLD" ]; then
            if [ -z "$OLD" ] && [ "$FIRST" -gt 0 ]; then
              NEWFIRST=$FIRST
              echo "[token] SHA qayd etildi, first_seen saqlanadi (seed): $FIRST"
            else
              NEWFIRST=$NOW
            fi
            printf '{\n "sha": "%s",\n "first_seen": %s,\n "last_reminded": ""\n}\n' "$SHA" "$NEWFIRST" > token_state.json
            git config user.name "shorts-bot"; git config user.email "bot@users.noreply.github.com"
            git add token_state.json
            git commit -m "token_state: YT_REFRESH_TOKEN qayd etildi" || true
            git pull --rebase || true
            git push || true
            echo "[token] yangi token qayd etildi (eslatma yuborilmadi)"
            exit 0
          fi
          AGE=$(( (NOW - FIRST) / 86400 ))
          echo "[token] token yoshi: ${AGE} kun (first_seen: ${FIRST})"
          if [ "$AGE" -ge 5 ] && [ "$LASTREM" != "$TODAY" ]; then
            MSG=$(sed "s/{{AGE}}/${AGE}/" scripts/token_message.txt)
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=${MSG}" -o /tmp/tg_resp.json -w "TG HTTP %{http_code}\n" || true
            head -c 200 /tmp/tg_resp.json || true; echo
            python3 -c "import json; s=json.load(open('token_state.json')); s['last_reminded']='$TODAY'; json.dump(s, open('token_state.json','w'), indent=1)"
            git config user.name "shorts-bot"; git config user.email "bot@users.noreply.github.com"
            git add token_state.json
            git commit -m "token_state: eslatma yuborildi ($TODAY)" || true
            git pull --rebase || true
            git push || true
            echo "[token] eslatma yuborildi (${AGE} kun, $TODAY)"
          else
            echo "[token] eslatma shart emas: yoshi ${AGE}/5 kun, oxirgi eslatma: ${LASTREM:-yoq}"
          fi

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat librsvg2-bin tesseract-ocr

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Save history and trends cache
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          if [ -f trends_cache.json ]; then
            git add -f trends_cache.json
          fi
          if [ -e script_pending.json ] || git ls-files --error-unmatch script_pending.json >/dev/null 2>&1; then
            git add -A -- script_pending.json
          fi
          if [ -d script_bank ]; then
            git add -A -- script_bank
          fi
          if [ -d script_used ]; then
            git add script_used
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update shorts history"
            git pull --rebase
            git push
          fi

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: work/final.mp4
          if-no-files-found: ignore
          retention-days: 7
