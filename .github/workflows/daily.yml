name: Daily Shorts Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,11,19 * * *"   # Tashkent: 08/16/24 (user jadvali: 3 run/kun)

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-montserrat librsvg2-bin tesseract-ocr

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Save history and trends cache
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          if [ -f trends_cache.json ]; then
            git add -f trends_cache.json
          fi
          if [ -e script_pending.json ] || git ls-files --error-unmatch script_pending.json >/dev/null 2>&1; then
            git add -A -- script_pending.json
          fi
          if [ -d script_bank ]; then
            git add -A -- script_bank
          fi
          if [ -d script_used ]; then
            git add script_used
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update shorts history"
            git pull --rebase
            git push
          fi

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: work/final.mp4
          if-no-files-found: ignore
          retention-days: 7
